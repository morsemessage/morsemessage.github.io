<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morse Message</title>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-512.png">
<meta property="og:title" content="Morse Message">
<meta property="og:image" content="https://morsemessage.github.io/icon-512.png">
<style>
  :root {
    /* Farben wie Morse Trainer / Morse Message App */
    --bg: #292A2B; --fg: #FFFFFF; --muted: #8E8E93;
    --card: rgba(0,0,0,.3); --accent: #E0A870; --accent-fg: #000000;
  }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--fg); padding:16px;
         font:16px/1.45 ui-monospace, "SF Mono", Menlo, monospace; text-align:center; }
  p { color:var(--muted); }
  h1 { color:var(--accent); }
  body { background:var(--bg); }
</style>
</head>
<body>
  <main>
    <img src="/icon-512.png" alt="" width="96" height="96" style="border-radius:22px"><h1>MORSE MESSAGE</h1>
    <p>Morse-Nachrichten per Link verschicken und abhören.</p>
  </main>
</body>
</html>
